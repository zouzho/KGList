<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌单列表</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 40px auto;
            max-width: 800px;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            color: #444;
        }
        ul {
            list-style-type: decimal;
            background: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <h1>🎵 歌单列表</h1>
    <ul>
        
    </ul>
</body>
</html>
