name: weekly-chart-playlist

# 每周一 01:00 UTC（北京时间周一 09:00）自动执行一次；
# 同时提供手动触发入口，可指定周次、榜单类型或平台做单源回补。
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "周次目录名（YYYY-MM-DD），留空表示使用执行日"
        required: false
        default: ""
      charts:
        description: "只处理指定榜单类型，逗号分隔（hot,new,europe），留空表示全部"
        required: false
        default: ""
      platforms:
        description: "只处理指定平台，逗号分隔（如 netease,qq,kugou），留空表示全部"
        required: false
        default: ""
  # 代码变更推送到默认分支时也执行一次，便于验证流程；
  # output/ 与 logs/ 的变更（工作流自身的回写提交）不触发，避免循环执行
  push:
    branches: [main]
    paths-ignore:
      - "output/**"
      - "logs/**"

permissions:
  contents: write

concurrency:
  group: weekly-chart-playlist
  cancel-in-progress: false

jobs:
  build-playlists:
    name: 生成每周歌单
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_WEEK: ${{ inputs.week }}
      INPUT_CHARTS: ${{ inputs.charts }}
      INPUT_PLATFORMS: ${{ inputs.platforms }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 采集并生成歌单
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${INPUT_WEEK}" ]; then ARGS="${ARGS} --week ${INPUT_WEEK}"; fi
          IFS=',' read -ra CHART_ITEMS <<< "${INPUT_CHARTS}"
          for item in "${CHART_ITEMS[@]}"; do
            item="$(echo "${item}" | tr -d '[:space:]')"
            if [ -n "${item}" ]; then ARGS="${ARGS} --chart ${item}"; fi
          done
          IFS=',' read -ra PLATFORM_ITEMS <<< "${INPUT_PLATFORMS}"
          for item in "${PLATFORM_ITEMS[@]}"; do
            item="$(echo "${item}" | tr -d '[:space:]')"
            if [ -n "${item}" ]; then ARGS="${ARGS} --platform ${item}"; fi
          done
          echo "运行参数：${ARGS}"
          python main.py run --config config/settings.yaml --format-config config/format.yaml ${ARGS}

      - name: 上传运行产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chart-playlist-output
          path: |
            output/**
            logs/**
          if-no-files-found: warn
          retention-days: 30

      - name: 汇总运行结果
        if: always()
        run: |
          {
            echo "### 本次产出文件"
            echo
            find output -type f \( -name "*.txt" -o -name "*.json" \) | grep -v '/raw/' | sort || true
            echo
            echo "### 运行报告"
            echo
            cat logs/run-*.md || echo "未生成运行报告"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 提交生成结果与运行记录到仓库
        # 无论成功失败都提交，失败时 logs/ 中的运行报告可用于定位问题；
        # 回写提交只涉及 output/ 与 logs/，不会再次触发本工作流
        if: always()
        continue-on-error: true
        run: |
          git add output logs
          if git diff --cached --quiet; then
            echo "本次运行没有需要提交的变更"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: 更新榜单歌单与运行记录 $(date -u +%F)"
          git push
