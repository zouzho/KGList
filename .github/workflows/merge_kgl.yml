# .github/workflows/merge_kgl.yml
name: Auto Merge KGL
run-name: Auto merge kgl files

on:
  schedule:
    # UTC 18:00 = 北京时间 02:00 每天凌晨2点
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write  # 关键：允许bot提交代码回仓库

jobs:
  run-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run merge_kgl.py
        run: python merge_kgl.py

      - name: Commit & Push gd.kgl back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gd.kgl
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto update gd.kgl" && git push)
